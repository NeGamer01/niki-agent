description: The Niki desktop app in your browser. `niki workbench` serves the desktop interface through the Niki dashboard, for headless servers, VPSes and tablets. Disclosure — community plugin, not a Niki product. On the first `niki workbench` run and again after each Niki update it runs `npm install --ignore-scripts` (guided by Niki's lockfile) and Vite against your Niki checkout's desktop sources, writing only under ~/.niki/niki-workbench and its own plugin dir (the checkout is only read), and starts `niki dashboard` on loopback when none is running.
