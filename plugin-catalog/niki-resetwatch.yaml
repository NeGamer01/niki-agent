description: "Track subscription quotas and reset times in Niki Desktop. Disclosure — probe.py re-executes itself under the Niki Python interpreter located via NIKI_PYTHON / VIRTUAL_ENV / the parent process or the Niki installer's managed venv (NIKI_HOME/installs); it reads provider API keys from the Niki .env, Niki's own saved OAuth logins (auth.json credential pool, read-only), the Vaultwarden plugin's local secret cache (cache/vaultwarden_cache.json, read-only, only when Vaultwarden is the sole enabled secret source) and Docker s6 container env files, plus other coding-assistant CLIs' local logins (including macOS keychain entries), and sends each key only to its own vendor's usage endpoint."
